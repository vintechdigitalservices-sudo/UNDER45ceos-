<!DOCTYPE html>
<html>
<body>
  <h2>Test Selar Verification</h2>
  <input type="text" id="orderId" placeholder="Enter Selar Order ID">
  <button onclick="testVerify()">Test Verify</button>
  <pre id="result"></pre>

  <script>
    async function testVerify() {
      const orderId = document.getElementById('orderId').value;
      if (!orderId) return alert('Enter an order ID');
      
      const res = await fetch('/api/selar/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orderId })
      });
      
      const data = await res.json();
      document.getElementById('result').textContent = JSON.stringify(data, null, 2);
    }
  </script>
</body>
</html>
